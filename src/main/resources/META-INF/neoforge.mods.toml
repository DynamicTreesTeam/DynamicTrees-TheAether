    type="required"
    versionRange="${dynamic_trees_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="dynamictreesplus"
    type="optional"
    versionRange="${dynamic_trees_plus_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="dtaddon_lib"
    type="required"
    versionRange="${dynamic_trees_addon_lib_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="aether"
    type="required"
    versionRange="${aether_version_range}"
